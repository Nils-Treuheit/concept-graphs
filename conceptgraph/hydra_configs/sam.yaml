defaults:
  - base_paths

sam_variant: sam # sam
sam_encoder_version: "vit_h"
# Local weights (see weights/ in the repository, override with CG_WEIGHTS_DIR).
# Note: the ultraLytics checkpoints (.pt) are used by the streamlined pipeline,
# the original Segment-Anything format (.pth) is only needed for the
# "normal SAM" code path.
sam_checkpoint_path: ${repo_root}/weights/sam_l.pt
mobile_sam_path: ${repo_root}/weights/mobile_sam.pt
