[project]
name = "concept-graphs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "clip",
    "dill>=0.4.1",
    "distinctipy>=1.3.4",
    "faiss-gpu-cu12>=1.15.1",
    "h5py>=3.16.0",
    "hydra-core>=1.3.7",
    "imageio>=2.38.1",
    "kornia>=0.8.3",
    "line-profiler>=5.1.0",
    "natsort>=8.4.0",
    "open-clip-torch>=3.3.0",
    "open3d>=0.20.0",
    "pandas>=3.0.6",
    "pip>=26.2.2",
    "pyliblzfse>=0.4.1",
    "pypng>=0.20220715.0",
    "pytorch3d",
    "requests>=2.34.2",
    "rerun-sdk>=0.40.0",
    "rich>=15.0.0",
    "setuptools>=84.2.1",
    "supervision>=0.31.1",
    "torch==2.14.1",
    "torchaudio==2.11.0",
    "torchcodec>=0.17.0",
    "torchvision==0.29.1",
    "transformers>=5.20.2",
    "tyro>=1.0.16",
    "ultralytics>=8.4.183",
    "wandb>=0.31.0",
    "wheel>=0.48.0",
]

[dependency-groups]
dev = ["pytest"]

[project.optional-dependencies]
realsense = ["pyrealsense2>=2.58.1"]

[tool.uv]
package = false

[tool.uv.sources]
clip = { git = "https://github.com/ultralytics/CLIP.git", rev = "7ffa84b3bfa40c42ecc1c77147a855e69cb2dd40" }
faiss-gpu-cu12 = { path = "third_party/faiss" }
pytorch3d = { path = "third_party/pytorch3d" }
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
